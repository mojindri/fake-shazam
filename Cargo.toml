[package]
name = "fake-shazam"
version = "0.1.0"
edition = "2024"

[dependencies]
cpal     = "0.15"   # microphone I/O
rustfft  = "6"
anyhow = "1.0.97"      # fast-Fourier transform
hound = "3"
symphonia = { version = "0.5", features = ["mp3"] }
tracing = {version = "0.1"}
tracing-subscriber = "0.3"
log = "0.4"
num-complex = "0.4.6"
rand="0.9"
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.43.0", features = ["rt", "rt-multi-thread", "macros"] }
[dev-dependencies]
approx = "0.5"